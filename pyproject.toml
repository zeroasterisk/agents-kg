[project]
name = "agents-kg"
version = "0.1.0"
description = "CLI for ingesting sources into the agents knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "neo4j>=5.0",
    "google-genai>=1.0",
    "readability-lxml>=0.8",
    "lxml-html-clean>=0.4",
    "prefect>=3.6.21",
]

[project.scripts]
kg = "agents_kg.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_kg"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring live Neo4j and/or Gemini API",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
